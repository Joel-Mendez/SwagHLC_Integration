transport:
  kind: ros2
  options:
    namespace: swag

run:
  duration_s: 3600
  mode: async

dataset:
  subject: MP301
  days: all
  trials: all
  activities: [1, 2, 2.1, 3, 4]
  loop: true

sources:
  - id: hd_emg
    modality: hd_emg
    chunk_size: 100

  - id: bp_emg
    modality: bp_emg
    chunk_size: 100
    params: [EMG_Left_AM, EMG_Left_BF, EMG_Left_GM, EMG_Left_Gmax, EMG_Left_RF,
             EMG_Left_ST, EMG_Left_TA, EMG_Left_VL, EMG_Right_AM, EMG_Right_BF,
             EMG_Right_GM, EMG_Right_Gmax, EMG_Right_RF, EMG_Right_ST,
             EMG_Right_TA, EMG_Right_VL]

  - id: imu_gyr
    modality: imu
    chunk_size: 100
    params: [Gyr_Left_Foot, Gyr_Left_Shank, Gyr_Left_Thigh, Gyr_Pelvis,
             Gyr_Right_Foot, Gyr_Right_Shank, Gyr_Right_Thigh, Gyr_T8]

models:
  - id: hd_emg
    type: torch
    checkpoint: ${SWAG_MODELS_ROOT}/HD_EMG/CustomResNet_Day_1-Day_2-Day_3-Day_7_20260614_132709/100
    activities: [1, 2, 2.1, 3, 4]
    inputs: [hd_emg]
    window: { window_size: 100, hop: 95 }
    infer_rate_hz: 20
    device: cuda:0

  - id: imu
    type: torch
    checkpoint: ${SWAG_MODELS_ROOT}/IMU/CustomResNet_Day_2-Day_3-Day_7_AllSubjects_20251223_000754/100
    activities: [1, 2, 2.1, 3, 4]
    inputs: [imu_gyr]
    window: { window_size: 100, hop: 95 }
    infer_rate_hz: 20
    device: cuda:0

  - id: bp_emg
    type: torch
    checkpoint: ${SWAG_MODELS_ROOT}/Bipolar/EMGCNN_Day_2-Day_3-Day_7_AllSubjects_20251222_134153/100
    activities: [1, 2, 2.1, 3, 4]
    inputs: [bp_emg]
    window: { window_size: 100, hop: 95 }
    infer_rate_hz: 20
    device: cuda:0

fusion:
  id: fusion
  inputs: [hd_emg, imu, bp_emg]
  method: sum
  rate_hz: 20
  smoothing: { method: majority, window: 7, min_confidence: 0.5 }
